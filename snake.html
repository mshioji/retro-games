<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNAKE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: monospace;
    color: #00ff41;
    user-select: none;
  }
  .phone {
    background: #2c2c54;
    border-radius: 30px;
    padding: 30px 25px 20px;
    box-shadow: 0 0 40px rgba(0,255,65,0.15), inset 0 0 20px rgba(0,0,0,0.3);
  }
  .brand {
    text-align: center;
    font-size: 11px;
    letter-spacing: 6px;
    color: #535388;
    margin-bottom: 12px;
  }
  body {
    overscroll-behavior: none;
  }
  .screen-frame {
    background: #0a1a0a;
    border-radius: 8px;
    padding: 12px;
    border: 2px solid #1a3a1a;
  }
  #score-bar {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #00ff41;
    margin-bottom: 8px;
    padding: 0 2px;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    border: 1px solid #0a3a0a;
    background: #0b1a0b;
    touch-action: none;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
  }
  .d-pad {
    display: grid;
    grid-template-columns: repeat(3, 42px);
    grid-template-rows: repeat(3, 42px);
    gap: 2px;
  }
  .d-pad button {
    background: #3d3d6b;
    border: none;
    border-radius: 8px;
    color: #00ff41;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
  }
  .d-pad button:hover { background: #4a4a7a; }
  .d-pad button:active { background: #5a5a9a; }
  .d-pad .empty { visibility: hidden; }
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: none;
  }
  .overlay span {
    font-size: 16px;
    color: #00ff41;
    text-shadow: 0 0 8px #00ff41;
  }
  .overlay .big { font-size: 26px; margin-bottom: 8px; }
  .overlay .hint { font-size: 11px; color: #538853; margin-top: 6px; }
  .canvas-wrap {
    position: relative;
  }
  .scanlines {
    position: absolute;
    top: 12px; left: 12px; right: 12px; bottom: 12px;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    border-radius: 4px;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="brand">classic retro games</div>
  <div class="screen-frame">
    <div id="score-bar">
      <span>SCORE <span id="score">0</span></span>
      <span>HIGH <span id="high">0</span></span>
    </div>
    <div class="canvas-wrap">
      <canvas id="game"></canvas>
      <div class="scanlines"></div>
      <div class="overlay" id="overlay">
        <span class="big" id="overlay-title">SNAKE</span>
        <span id="overlay-sub">PRESS ANY KEY</span>
        <span class="hint">ARROW KEYS, WASD, SPACE, or SWIPE to start</span>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="d-pad">
      <div class="empty"></div>
      <button id="btn-up">&#9650;</button>
      <div class="empty"></div>
      <button id="btn-left">&#9664;</button>
      <div class="empty"></div>
      <button id="btn-right">&#9654;</button>
      <div class="empty"></div>
      <button id="btn-down">&#9660;</button>
      <div class="empty"></div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highEl = document.getElementById('high');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlaySub = document.getElementById('overlay-sub');

const CELL = 16;
const COLS = 20;
const ROWS = 20;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

let snake, dir, nextDir, food, score, highScore = parseInt(localStorage.getItem('snake_high') || '0', 10), state, speed, loop;

const STATE = { IDLE: 0, PLAYING: 1, DEAD: 2 };

function init() {
  const midX = Math.floor(COLS / 2);
  const midY = Math.floor(ROWS / 2) - 5;
  snake = [{x: midX, y: midY}, {x: midX - 1, y: midY}, {x: midX - 2, y: midY}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = 130;
  scoreEl.textContent = 0;
  highEl.textContent = highScore;
  placeFood();
  draw();
}

function placeFood() {
  const occupied = new Set(snake.map(s => s.x + ',' + s.y));
  let x, y;
  do {
    x = Math.floor(Math.random() * COLS);
    y = Math.floor(Math.random() * ROWS);
  } while (occupied.has(x + ',' + y));
  food = {x, y};
}

function setDir(x, y) {
  // Prevent reversing
  if (dir.x === -x && dir.y === -y) return;
  if (dir.x === x && dir.y === y) return;
  nextDir = {x, y};
}

function step() {
  dir = {...nextDir};
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    die(); return;
  }
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    die(); return;
  }

  snake.unshift(head);

  // Eat food
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score > highScore) {
      highScore = score;
      highEl.textContent = highScore;
      localStorage.setItem('snake_high', highScore);
    }
    placeFood();
    // Speed up slightly
    speed = Math.max(60, speed - 2);
    clearInterval(loop);
    loop = setInterval(step, speed);
  } else {
    snake.pop();
  }

  draw();
}

function die() {
  state = STATE.DEAD;
  clearInterval(loop);
  // Flash the snake red
  draw(true);
  overlayTitle.textContent = 'GAME OVER';
  overlaySub.textContent = 'SCORE: ' + score;
  overlay.style.display = 'flex';
}

function draw(flip = false) {
  ctx.fillStyle = '#0b1a0b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid dots
  ctx.fillStyle = '#0f220f';
  for (let x = 0; x < COLS; x++) {
    for (let y = 0; y < ROWS; y++) {
      ctx.fillRect(x * CELL + CELL/2 - 0.5, y * CELL + CELL/2 - 0.5, 1, 1);
    }
  }

  // Food
  ctx.fillStyle = '#ff3333';
  ctx.shadowColor = '#ff3333';
  ctx.shadowBlur = flip ? 0 : 6;
  ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
  ctx.shadowBlur = 0;

  // Snake
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    if (flip && i > 0) {
      ctx.fillStyle = '#ff4444';
    } else if (i === 0) {
      ctx.fillStyle = '#00ff41';
      ctx.shadowColor = '#00ff41';
      ctx.shadowBlur = 4;
    } else {
      ctx.fillStyle = '#00cc33';
      ctx.shadowBlur = 0;
    }
    const inset = i === 0 ? 1 : 2;
    ctx.fillRect(s.x * CELL + inset, s.y * CELL + inset, CELL - inset*2, CELL - inset*2);
    ctx.shadowBlur = 0;
  }

  // Head eyes
  if (!flip) {
    const h = snake[0];
    ctx.fillStyle = '#0b1a0b';
    const ex = CELL / 4, ey = CELL / 4, er = 2.2;
    const cx = h.x * CELL + CELL/2, cy = h.y * CELL + CELL/2;
    const e1x = cx + dir.x * 3 - dir.y * 2;
    const e1y = cy + dir.y * 3 - dir.x * 2;
    const e2x = cx - dir.x * 3 + dir.y * 2;
    const e2y = cy - dir.y * 3 + dir.x * 2;
    ctx.beginPath(); ctx.arc(e1x, e1y, er, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x, e2y, er, 0, Math.PI*2); ctx.fill();
  }
}

function startGame() {
  overlay.style.display = 'none';
  state = STATE.PLAYING;
  init();
  loop = setInterval(step, speed);
}

document.addEventListener('keydown', (e) => {
  if (state === STATE.IDLE || state === STATE.DEAD) {
    startGame();
    return;
  }
  const map = {
    ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
    w: [0,-1], s: [0,1], a: [-1,0], d: [1,0],
    W: [0,-1], S: [0,1], A: [-1,0], D: [1,0],
  };
  const [dx, dy] = map[e.key] || [0, 0];
  if (dx !== 0 || dy !== 0) {
    e.preventDefault();
    setDir(dx, dy);
  } else if (e.key === ' ') {
    // Spacebar also starts game
    startGame();
    e.preventDefault();
  }
});

// Touch buttons
function onButtonPress(dx, dy) {
  if (state === STATE.IDLE || state === STATE.DEAD) { startGame(); return; }
  if (state === STATE.PLAYING) setDir(dx, dy);
}
document.getElementById('btn-up').onclick    = () => onButtonPress(0, -1);
document.getElementById('btn-down').onclick   = () => onButtonPress(0, 1);
document.getElementById('btn-left').onclick   = () => onButtonPress(-1, 0);
document.getElementById('btn-right').onclick  = () => onButtonPress(1, 0);

// Swipe support
let tx, ty;
canvas.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  if (state === STATE.IDLE) startGame();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (state !== STATE.PLAYING) return;
  e.preventDefault();
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
}, { passive: false });

state = STATE.IDLE;
init();
</script>
</body>
</html>
